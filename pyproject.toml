[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubt"
version = "0.2.0"
description = "Universal braille-to-text translation: synthetic data, training and evaluation"
requires-python = ">=3.10"
dependencies = [
    "louis",
    "PyYAML>=6.0",
    "pycountry>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
experiments = [
    "numpy", "rapidfuzz", "pyarrow", "datasets", "huggingface_hub",
    "torch", "transformers", "peft", "accelerate", "trl", "vllm", "liger-kernel",
    "sacrebleu", "openai", "latex2mathml", "pymupdf", "wandb",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ubt = ["data/*.txt", "metrics/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
